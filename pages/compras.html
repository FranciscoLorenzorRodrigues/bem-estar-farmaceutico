<!DOCTYPE html>

<body>

    <header class="header">

        <div class="icons">

    <i class="fa-solid fa-cart-shopping"></i></a>
</div>
    </header>

    <nav class="menu">

        <main class="grid-produtos" id="lista-medicamentos">
